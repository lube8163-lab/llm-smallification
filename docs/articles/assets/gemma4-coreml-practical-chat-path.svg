<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#f5f5f0"/>

  <!-- title -->
  <text x="48" y="52" font-size="19" fill="#1a1a1a">Gemma 4 12B を iPhone で実用マルチモーダルチャットにする</text>
  <text x="49" y="84" font-size="15" fill="#555">目標: 3 モダリティを pal4/ANE 中心 + KV キャッシュで、意味のある応答を返す速度まで乗せる。</text>

  <!-- ===== input modality boxes ===== -->
  <!-- text -->
  <rect x="48" y="138" width="278" height="112" rx="14" fill="#e8f2ec" stroke="#2f7d5b" stroke-width="1.5"/>
  <text x="72" y="170" font-size="16" fill="#1a1a1a">Text</text>
  <text x="72" y="198" font-size="14" fill="#1a1a1a">input_ids [1,320]</text>
  <text x="72" y="222" font-size="13" fill="#666">Gemma tokenizer + text embedding</text>

  <!-- image -->
  <rect x="48" y="304" width="278" height="128" rx="14" fill="#e6ecfb" stroke="#3a5bbf" stroke-width="1.5"/>
  <text x="72" y="336" font-size="16" fill="#1a1a1a">Image</text>
  <text x="72" y="364" font-size="14" fill="#1a1a1a">pixel_values [1,256,6912]</text>
  <text x="72" y="386" font-size="14" fill="#1a1a1a">768x768, 16x16 グリッド</text>
  <text x="72" y="410" font-size="13" fill="#666">embed_vision を fp32 で再構築</text>

  <!-- audio -->
  <rect x="48" y="486" width="278" height="112" rx="14" fill="#fdefd6" stroke="#b5791f" stroke-width="1.5"/>
  <text x="72" y="518" font-size="16" fill="#1a1a1a">Audio</text>
  <text x="72" y="546" font-size="14" fill="#1a1a1a">input_features [1,32,640]</text>
  <text x="72" y="570" font-size="13" fill="#666">生 16kHz PCM, 40ms/token</text>

  <!-- connectors from modalities to seam -->
  <path d="M326 194 C 380 194, 380 356, 430 356" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <path d="M326 368 C 380 368, 388 360, 430 360" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <path d="M326 542 C 384 542, 384 372, 430 372" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- ===== shared seam ===== -->
  <rect x="430" y="286" width="236" height="150" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="454" y="320" font-size="16" fill="#1a1a1a">Shared seam</text>
  <text x="454" y="350" font-size="14" fill="#1a1a1a">hidden [1,320,3840]</text>
  <text x="454" y="378" font-size="13" fill="#666">image/audio hidden を</text>
  <text x="454" y="398" font-size="13" fill="#666">窓に差し込む</text>

  <path d="M666 361 L 756 361" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- ===== KV decoder ===== -->
  <rect x="756" y="196" width="300" height="230" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="792" y="230" font-size="16" fill="#1a1a1a">KV-cache decoder (pal4 / mixed)</text>
  <text x="792" y="262" font-size="14" fill="#1a1a1a">Seq320 prefill → seq1 decode</text>
  <text x="792" y="288" font-size="14" fill="#1a1a1a">48 層（sliding 40 + full 8）</text>
  <text x="792" y="314" font-size="14" fill="#1a1a1a">cache 512 スロット</text>
  <text x="792" y="346" font-size="13" fill="#666">sliding は ANE、full 8 層は CPU+GPU</text>
  <text x="792" y="368" font-size="13" fill="#666">warm 約 0.2〜0.3 tok/s (iPhone 14)</text>
  <text x="792" y="390" font-size="13" fill="#666">footprint 約 400MB</text>

  <path d="M1056 311 L 1104 311" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- ===== head ===== -->
  <rect x="1104" y="256" width="128" height="150" rx="14" fill="#e8f2ec" stroke="#2f7d5b" stroke-width="1.5"/>
  <text x="1126" y="290" font-size="16" fill="#1a1a1a">Head</text>
  <text x="1126" y="320" font-size="14" fill="#1a1a1a">norm</text>
  <text x="1126" y="344" font-size="14" fill="#1a1a1a">lm_head</text>
  <text x="1126" y="372" font-size="13" fill="#666">1 token</text>

  <!-- ===== speculative drafter (side) ===== -->
  <rect x="756" y="470" width="476" height="128" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="792" y="504" font-size="16" fill="#1a1a1a">投機デコード（実装予定・部品は変換済み）</text>
  <text x="792" y="534" font-size="13.5" fill="#444">MTP ドラフタ（4 層）が本体 KV に cross-attend → K 本を先読み</text>
  <text x="792" y="556" font-size="13.5" fill="#444">verify は 1 スイープで K トークンを一括検証 → 受理ぶん load を償却</text>
  <text x="792" y="578" font-size="13" fill="#666">A100 assisted generation 1.71x（実機 acceptance は未計測）</text>

  <!-- dashed arrow from decoder to drafter -->
  <path d="M906 426 L 906 470" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ===== measured footer ===== -->
  <rect x="430" y="486" width="300" height="112" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="454" y="518" font-size="15" fill="#1a1a1a">実機で確認できたこと</text>
  <text x="454" y="544" font-size="13" fill="#444">画像: 実写真を正しく記述</text>
  <text x="454" y="566" font-size="13" fill="#444">音声: 「2+2?」→「The answer is 4.」</text>
  <text x="454" y="588" font-size="13" fill="#444">テキスト: 51 トークンの長文を文脈保持</text>

  <!-- bottom note -->
  <path d="M180 646 C 520 626, 760 626, 1100 646" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="7 6"/>
  <text x="640" y="672" font-size="14" fill="#555" text-anchor="middle">前回の「経路は通るが実用は厳しい」から、「工夫すればちゃんと喋る」へ更新できた到達点です。</text>
</svg>
